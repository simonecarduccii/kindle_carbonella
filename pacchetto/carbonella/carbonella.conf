# Carbonella - impostazioni
# Questi sono i valori predefiniti e vengono sostituiti a ogni aggiornamento.
# Per cambiarli in modo permanente scrivi le stesse righe in carbonella/dati/preferenze.conf
# (collegando il Kindle al computer): quelle valgono di più e restano dopo gli aggiornamenti.
# Le righe che iniziano con # sono commenti. Dopo una modifica, riapri Carbonella.

# Nome mostrato in alto a sinistra nella Home (per esempio: Kindle di Simone).
nome = Carbonella

# Cartella dove cercare i libri (.epub e .txt), anche nelle sottocartelle.
libri = /mnt/us/documents

# Dimensione del testo di lettura in pixel (14, 16, 18, 20, 22, 24, 28).
# Si cambia anche dal menu durante la lettura: la scelta viene salvata in dati/preferenze.conf.
dimensione_testo = 18

# Margine sinistro e destro in pixel: 32 stretti, 48 medi (come nel design), 64 larghi.
# Interlinea, margini, dimensione e refresh si cambiano anche dalle Impostazioni.
margine = 48

# Interlinea in percentuale della dimensione del testo (150 = 1,5 come nel design).
interlinea = 150

# Testo giustificato (1) o allineato a sinistra (0).
giustifica = 1

# Ogni quante pagine fare il "lampeggio" che pulisce lo schermo e-ink.
lampeggio_ogni = 6

# Come fare il lampeggio: area (predefinito), display, inverti.
# Se resta l'ombra della pagina precedente, prova "inverti".
lampeggio = area

# Dopo quanti minuti senza toccare tasti Carbonella si chiude e torna al Kindle
# (così il Kindle può andare in standby e non consuma la batteria). 0 = mai.
inattivita_minuti = 20

# Obiettivo di lettura giornaliero in minuti (in alto nella Home: "Oggi 13/30 minuti").
# Si cambia anche dal menu della Home.
obiettivo_minuti = 30

# Ordine della Home: 0 più recente, 1 titolo, 2 autore. Si cambia anche dal menu della Home.
ordina = 0

# Libri da leggere quest'anno (si cambia anche dalle Impostazioni).
libri_anno = 12

# 1 = all'avvio riapre subito l'ultimo libro letto; 0 = parte dalla libreria.
apri_ultimo = 0

# Sillabazione italiana (va a capo dividendo le parole in sillabe): 1 sì, 0 no.
# Vale solo per i libri in italiano.
sillabazione = 1
